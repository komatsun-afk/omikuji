<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>みおみくじ</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap');

  :root{
    --paper: #F1E7D6;
    --paper-dark: #E7D9C0;
    --indigo: #1F2E4A;
    --indigo-deep: #16213A;
    --vermillion: #C63B31;
    --vermillion-deep: #A32E26;
    --gold: #BC9A3C;
    --ink: #2B2620;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin:0;
    padding:0;
    background: var(--indigo-deep);
    font-family: 'Zen Kaku Gothic New', sans-serif;
    color: var(--ink);
    -webkit-tap-highlight-color: transparent;
  }

  body{
    min-height: 100vh;
    min-height: 100dvh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 24px 16px;
    overflow-x:hidden;
  }

  /* subtle night-sky texture behind everything */
  .sky{
    position:fixed;
    inset:0;
    background:
      radial-gradient(1px 1px at 20% 30%, rgba(255,255,255,0.35) 0, transparent 100%),
      radial-gradient(1px 1px at 70% 60%, rgba(255,255,255,0.25) 0, transparent 100%),
      radial-gradient(1.5px 1.5px at 40% 80%, rgba(255,255,255,0.3) 0, transparent 100%),
      radial-gradient(1px 1px at 85% 20%, rgba(255,255,255,0.3) 0, transparent 100%),
      radial-gradient(1px 1px at 60% 15%, rgba(255,255,255,0.2) 0, transparent 100%),
      radial-gradient(1.5px 1.5px at 10% 65%, rgba(255,255,255,0.25) 0, transparent 100%),
      linear-gradient(180deg, var(--indigo-deep) 0%, var(--indigo) 100%);
    z-index:0;
  }

  .stage{
    position:relative;
    z-index:1;
    width:100%;
    max-width: 400px;
  }

  /* ---------- torii header ---------- */
  .torii-wrap{
    display:flex;
    justify-content:center;
    margin-bottom: 4px;
  }
  .torii-wrap svg{ width: 92px; height: auto; }

  .heading{
    text-align:center;
    color: var(--paper);
    margin: 6px 0 26px;
  }
  .heading .en{
    display:block;
    font-size: 11px;
    letter-spacing: 0.35em;
    color: var(--gold);
    margin-bottom: 6px;
  }
  .heading h1{
    font-family:'Shippori Mincho', serif;
    font-weight: 800;
    font-size: 34px;
    margin: 0;
    letter-spacing: 0.12em;
  }
  .heading p{
    font-family:'Shippori Mincho', serif;
    font-size: 13px;
    margin: 8px 0 0;
    color: rgba(241,231,214,0.7);
    letter-spacing: 0.05em;
  }

  /* ---------- draw box ---------- */
  .box-area{
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  .kuji-box{
    position:relative;
    width: 180px;
    height: 180px;
    cursor:pointer;
    border:none;
    background:none;
    padding:0;
  }
  .kuji-box:disabled{ cursor:default; }

  .kuji-box svg{ width:100%; height:100%; display:block; }

  .kuji-box.shaking svg{
    animation: shake 0.5s ease-in-out infinite;
  }
  @keyframes shake{
    0%,100%{ transform: rotate(0deg); }
    20%{ transform: rotate(-4deg); }
    40%{ transform: rotate(3deg); }
    60%{ transform: rotate(-3deg); }
    80%{ transform: rotate(4deg); }
  }

  .stick{
    position:absolute;
    left:50%;
    top:8%;
    width:10px;
    height:70px;
    background: linear-gradient(180deg, #FBF3E3, #E9DBC0);
    border:1px solid rgba(43,38,32,0.25);
    border-radius: 2px 2px 0 0;
    transform-origin: bottom center;
    transform: translateX(-50%) translateY(0) rotate(0deg);
    opacity:0;
    pointer-events:none;
  }
  .stick.rise{
    animation: rise 0.9s cubic-bezier(.2,.8,.3,1) forwards;
  }
  @keyframes rise{
    0%{ opacity:0; transform: translateX(-50%) translateY(0) rotate(0deg); }
    15%{ opacity:1; }
    100%{ opacity:1; transform: translateX(-50%) translateY(-110px) rotate(-14deg); }
  }

  .prompt{
    margin-top: 22px;
    font-family:'Shippori Mincho', serif;
    color: var(--paper);
    font-size: 15px;
    letter-spacing: 0.08em;
    min-height: 20px;
    text-align:center;
  }

  .hint{
    margin-top: 6px;
    font-size: 11px;
    color: rgba(241,231,214,0.5);
    letter-spacing: 0.04em;
  }

  /* ---------- result card ---------- */
  .result{
    width:100%;
    margin-top: 8px;
    opacity:0;
    transform: translateY(16px);
    pointer-events:none;
  }
  .result.show{
    opacity:1;
    transform:none;
    pointer-events:auto;
    transition: opacity 0.6s ease, transform 0.6s ease;
  }

  .slip{
    background: var(--paper);
    background-image:
      repeating-linear-gradient(90deg, rgba(43,38,32,0.02) 0 1px, transparent 1px 3px);
    border-radius: 6px;
    padding: 30px 26px 26px;
    position:relative;
    box-shadow: 0 20px 45px rgba(0,0,0,0.35);
  }
  .slip::before{
    content:"";
    position:absolute;
    top:0; left:14px; right:14px;
    height: 5px;
    background: var(--vermillion);
    border-radius: 0 0 4px 4px;
  }

  .rank-row{
    display:flex;
    align-items:baseline;
    justify-content:center;
    gap: 10px;
    margin: 6px 0 4px;
  }
  .rank{
    font-family:'Shippori Mincho', serif;
    font-weight: 800;
    font-size: 46px;
    color: var(--vermillion-deep);
    letter-spacing: 0.06em;
    line-height:1;
  }

  .overall{
    text-align:center;
    font-family:'Shippori Mincho', serif;
    font-size: 14.5px;
    line-height: 1.9;
    color: var(--ink);
    margin: 14px 0 20px;
    padding: 0 4px;
  }

  .divider{
    height:1px;
    background: rgba(43,38,32,0.15);
    margin: 18px 0;
  }

  .categories{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px 18px;
  }
  .cat{
    display:flex;
    flex-direction:column;
    gap: 3px;
  }
  .cat .label{
    font-size: 11px;
    color: var(--vermillion-deep);
    letter-spacing: 0.08em;
    font-weight: 700;
  }
  .cat .text{
    font-size: 13px;
    line-height: 1.55;
    color: var(--ink);
  }

  .proverb{
    margin-top: 20px;
    padding-top: 18px;
    border-top: 1px dashed rgba(43,38,32,0.2);
    text-align:center;
    font-family:'Shippori Mincho', serif;
    font-size: 13.5px;
    line-height: 1.8;
    color: var(--ink);
  }

  .lucky-row{
    display:flex;
    justify-content:center;
    gap: 22px;
    margin-top: 18px;
    flex-wrap:wrap;
  }
  .lucky{
    text-align:center;
  }
  .lucky .label{
    font-size: 10px;
    letter-spacing: 0.1em;
    color: rgba(43,38,32,0.55);
    margin-bottom: 3px;
  }
  .lucky .value{
    font-size: 13px;
    font-weight: 700;
    color: var(--indigo);
  }

  .again{
    display:block;
    margin: 22px auto 0;
    background: none;
    border: 1px solid rgba(241,231,214,0.4);
    color: var(--paper);
    font-family:'Zen Kaku Gothic New', sans-serif;
    font-size: 13px;
    letter-spacing: 0.1em;
    padding: 11px 22px;
    border-radius: 999px;
    cursor:pointer;
  }
  .again:active{ background: rgba(241,231,214,0.08); }

  @media (prefers-reduced-motion: reduce){
    .kuji-box.shaking svg{ animation: none; }
    .stick.rise{ animation: none; opacity:1; transform: translateX(-50%) translateY(-110px) rotate(-14deg); }
    .result{ transition:none; }
  }
</style>
</head>
<body>

<div class="sky"></div>

<div class="stage">

  <div class="torii-wrap">
    <svg viewBox="0 0 100 80" xmlns="http://www.w3.org/2000/svg">
      <rect x="8" y="14" width="84" height="7" rx="1.5" fill="#C63B31"/>
      <rect x="14" y="24" width="72" height="4.5" rx="1" fill="#A32E26"/>
      <rect x="20" y="18" width="7" height="56" fill="#C63B31"/>
      <rect x="73" y="18" width="7" height="56" fill="#C63B31"/>

  <div class="heading">

  <div class="box-area">

        <rect x="20" y="34" width="60" height="52" rx="3" fill="#7A1F1A"/>
        <rect x="20" y="34" width="60" height="52" rx="3" fill="none" stroke="#BC9A3C" stroke-width="1.5"/>
        <rect x="20" y="34" width="60" height="10" fill="#5E1611"/>
        <circle cx="50" cy="39" r="6.5" fill="#F1E7D6" stroke="#BC9A3C" stroke-width="1"/>
        <text x="50" y="42.5" font-size="7" text-anchor="middle" fill="#7A1F1A" font-family="serif" font-weight="700">籤</text>
        <rect x="30" y="52" width="40" height="26" rx="2" fill="none" stroke="#BC9A3C" stroke-width="1"/>
        <line x1="30" y1="65" x2="70" y2="65" stroke="#BC9A3C" stroke-width="0.75"/>
      </svg>
      <div class="stick" id="stick"></div>
    </button>

    <div class="prompt" id="prompt">タップして、おみくじを引く</div>
    <div class="hint" id="hint">一日一回、心を込めて</div>
  </div>

  <div class="result" id="result">
    <div class="slip" id="slip">
      <!-- filled by JS -->
    </div>
    <button class="again" id="againBtn">もう一度引く</button>
  </div>

</div>

<script>
(function(){

      health: ["軽い運動や早めの休息が調子を整えてくれます。", "規則正しい生活が良いリズムを作ります。", "疲れをためずこまめにケアを。"],

  var items = ["扇子", "手鏡", "御守り", "万年筆", "湯呑み", "小さな鈴", "手ぬぐい", "栞"];

  function pick(arr){ return arr[Math.floor(Math.random() * arr.length)]; }

  function weightedRank(){
    var total = fortunes.reduce(function(sum, f){ return sum + f.weight; }, 0);
    var r = Math.random() * total;
    for (var i = 0; i < fortunes.length; i++){
      r -= fortunes[i].weight;

  }

  var stick = document.getElementById('stick');

  var resultEl = document.getElementById('result');
  var slip = document.getElementById('slip');

  function renderSlip(f){
    var cats = categoryPools[f.rank];
    slip.innerHTML =
      '<div class="rank-row"><div class="rank">' + f.rank + '</div></div>' +
      '<div class="overall">' + pick(f.overall) + '</div>' +

      '<div class="proverb">' + pick(proverbs) + '</div>' +
      '<div class="lucky-row">' +
        '<div class="lucky"><div class="label">LUCKY COLOR</div><div class="value">' + pick(colors) + '</div></div>' +
        '<div class="lucky"><div class="label">LUCKY ITEM</div><div class="value">' + pick(items) + '</div></div>' +
        '<div class="lucky"><div class="label">LUCKY NUMBER</div><div class="value">' + (Math.floor(Math.random()*9)+1) + '</div></div>' +
      '</div>';
  }

  function draw(){
    if (box.disabled) return;
    box.disabled = true;
    box.classList.add('shaking');
    prompt.textContent = 'おみくじを引いています…';
    hint.style.visibility = 'hidden';

    setTimeout(function(){
      box.classList.remove('shaking');
      stick.classList.add('rise');

      setTimeout(function(){
        var f = weightedRank();
        renderSlip(f);
        prompt.textContent = '結果が出ました';
        resultEl.classList.add('show');
        resultEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }, 700);

    }, 1100);
  }

  function reset(){
    resultEl.classList.remove('show');
    stick.classList.remove('rise');
    box.disabled = false;
    prompt.textContent = 'タップして、おみくじを引く';
    hint.style.visibility = 'visible';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  box.addEventListener('click', draw);
  againBtn.addEventListener('click', reset);

  // ページを開いた瞬間に自動でおみくじを引く
  window.addEventListener('load', function(){
    setTimeout(draw, 400);
  });

})();
</script>

</body>
</html>
