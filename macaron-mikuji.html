<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>マカロンみくじ</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=Kosugi+Maru&display=swap');

  :root{
    --cream: #FBF3E7;
    --box: #FFFFFF;
    --choco: #6B4A34;
    --choco-soft: #8A6A50;
    --pink: #E8748A;
    --pink-deep: #D2536B;
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }

  html, body{ margin:0; padding:0; background: var(--cream); font-family:'Kosugi Maru', sans-serif; color: var(--choco); }

  body{
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding: 30px 16px 60px;
    position:relative;
    overflow-x:hidden;
  }

  .dots-bg{
    position:fixed;
    inset:0;
    z-index:0;
    background-image:
      radial-gradient(circle, rgba(232,116,138,0.10) 6px, transparent 7px),
      radial-gradient(circle, rgba(168,224,206,0.12) 5px, transparent 6px),
      radial-gradient(circle, rgba(201,184,232,0.10) 5px, transparent 6px);
    background-size: 90px 90px, 70px 70px, 110px 110px;
    background-position: 0 0, 30px 40px, 60px 10px;
  }

  .stage{ position:relative; z-index:1; width:100%; max-width:420px; }

  .header{ text-align:center; margin-bottom: 22px; }
  .header .en{
    display:block;
    font-size: 11px;
    letter-spacing: 0.3em;
    color: var(--pink-deep);
    margin-bottom: 8px;
  }
  .header h1{
    font-family:'Mochiy Pop One', sans-serif;
    font-size: 30px;
    margin: 0;
    color: var(--choco);
  }
  .header p{
    margin: 10px 0 0;
    font-size: 13.5px;
    color: var(--choco-soft);
  }

  /* ---------- macaron grid ---------- */
  .grid-wrap{ position:relative; }

  .macaron-grid{
    display:grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
    justify-items:center;
    padding: 6px 4px;
  }

  .macaron-btn{
    background:none;
    border:none;
    padding:0;
    width: 100%;
    aspect-ratio: 1;
    max-width: 78px;
    cursor:pointer;
    transition: opacity 0.35s ease, filter 0.35s ease, transform 0.25s ease;
  }
  .macaron-btn:active{ transform: scale(0.92); }
  .macaron-btn.dim{
    opacity: 0.22;
    filter: grayscale(60%);
    pointer-events:none;
  }
  .macaron-btn.picked{ pointer-events:none; }

  .macaron-inner{
    width:100%;
    height:100%;
    filter: drop-shadow(0 5px 6px rgba(107,74,52,0.18));
    transform-origin: center;
    transition: transform 0.32s cubic-bezier(.4,0,.3,1), opacity 0.32s ease;
  }
  .macaron-inner svg{ width:100%; height:100%; display:block; }

  .bubble{
    position:absolute;
    left:50%;
    top:-6px;
    transform: translate(-50%, -100%) scale(0.85);
    background: var(--box);
    border: 2px solid var(--pink);
    color: var(--pink-deep);
    font-family:'Mochiy Pop One', sans-serif;
    font-size: 13px;
    padding: 8px 16px;
    border-radius: 999px;
    white-space:nowrap;
    opacity:0;
    pointer-events:none;
    transition: opacity 0.25s ease, transform 0.25s ease;
    z-index:5;
  }
  .bubble.show{ opacity:1; transform: translate(-50%, -100%) scale(1); }

  .crumb{
    position: fixed;
    width: 7px;
    height: 7px;
    border-radius: 2px;
    pointer-events:none;
    z-index: 20;
    animation: crumbFly 0.7s ease-out forwards;
  }
  @keyframes crumbFly{
    0%{ transform: translate(0,0) rotate(0deg); opacity:1; }
    100%{ transform: translate(var(--dx), var(--dy)) rotate(var(--rot)); opacity:0; }
  }

  .prompt{
    text-align:center;
    margin-top: 20px;
    font-size: 14px;
    color: var(--choco-soft);
    min-height: 18px;
  }

  /* ---------- result ---------- */
  .result{
    width:100%;
    margin-top: 6px;
    opacity:0;
    transform: translateY(18px);
    pointer-events:none;
  }
  .result.show{
    opacity:1;
    transform:none;
    pointer-events:auto;
    transition: opacity 0.55s ease, transform 0.55s ease;
  }

  .slip{
    background: var(--box);
    border-radius: 22px;
    padding: 30px 24px 26px;
    box-shadow: 0 16px 40px rgba(107,74,52,0.16);
    position:relative;
  }
  .slip::before{
    content:"";
    position:absolute;
    top:-10px; left:50%;
    transform: translateX(-50%);
    width: 34px; height: 20px;
    background: var(--pink);
    border-radius: 12px;
  }

  .rank{
    text-align:center;
    font-family:'Mochiy Pop One', sans-serif;
    font-size: 40px;
    color: var(--pink-deep);
    margin: 8px 0 14px;
    letter-spacing: 0.04em;
  }
  .rank rt{
    font-family:'Kosugi Maru', sans-serif;
    font-size: 17px;
    color: var(--pink-deep);
    letter-spacing: 0;
  }

  .overall{
    text-align:center;
    font-size: 14.5px;
    line-height: 1.9;
    color: var(--choco);
    margin-bottom: 20px;
    padding: 0 2px;
  }

  .divider{ height:1px; background: rgba(107,74,52,0.12); margin: 16px 0; }

  .categories{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px 18px;
  }
  .cat .label{
    font-size: 11px;
    color: var(--pink-deep);
    font-weight: 700;
    letter-spacing: 0.05em;
    margin-bottom: 3px;
  }
  .cat .text{ font-size: 13px; line-height: 1.55; color: var(--choco); }

  .proverb{
    margin-top: 18px;
    padding-top: 16px;
    border-top: 1px dashed rgba(107,74,52,0.18);
    text-align:center;
    font-size: 13.5px;
    line-height: 1.8;
    color: var(--choco-soft);
  }

  .lucky-row{
    display:flex;
    justify-content:center;
    gap: 20px;
    margin-top: 18px;
    flex-wrap:wrap;
  }
  .lucky{ text-align:center; }
  .lucky .label{ font-size: 10px; letter-spacing:0.08em; color: rgba(107,74,52,0.5); margin-bottom:3px; }
  .lucky .value{ font-size: 13px; font-weight: 700; color: var(--pink-deep); }

  .again{
    display:block;
    margin: 22px auto 0;
    background: var(--pink);
    border: none;
    color: #fff;
    font-family:'Kosugi Maru', sans-serif;
    font-size: 13.5px;
    letter-spacing: 0.05em;
    padding: 12px 26px;
    border-radius: 999px;
    cursor:pointer;
  }
  .again:active{ background: var(--pink-deep); }

  @media (prefers-reduced-motion: reduce){
    .macaron-inner, .macaron-btn, .result, .crumb{ transition:none; animation:none; }
  }
</style>
</head>
<body>

<div class="dots-bg"></div>

<div class="stage">

  <div class="header">
    <span class="en">MACARON&nbsp;FORTUNE</span>
    <h1>マカロンみくじ</h1>
    <p>好きな一粒をタップしてね</p>
  </div>

  <div class="grid-wrap" id="gridWrap">
    <div class="bubble" id="bubble">むしゃむしゃ…</div>
    <div class="macaron-grid" id="macaronGrid"></div>
  </div>

  <div class="prompt" id="prompt">気になる一粒を選んでください</div>

  <div class="result" id="result">
    <div class="slip" id="slip"></div>
    <button class="again" id="againBtn">もう一度食べる</button>
  </div>

</div>

<script>
(function(){

  var themes = [
    { name:"苺",       shell:"#F5B8C6", shellLight:"#FAD4DC", filling:"#E8748A", fillingDark:"#D2536B" },
    { name:"ピスタチオ", shell:"#B9D9A0", shellLight:"#D3E9C2", filling:"#7FAE5C", fillingDark:"#5E8A3F" },
    { name:"ラベンダー", shell:"#C9B8E8", shellLight:"#DED0F2", filling:"#9E82D6", fillingDark:"#7C5FBD" },
    { name:"レモン",     shell:"#F5E6A0", shellLight:"#FAF0C4", filling:"#E8C94A", fillingDark:"#C9A82B" },
    { name:"ショコラ",   shell:"#C9A17E", shellLight:"#DFC3A3", filling:"#8B5E3C", fillingDark:"#6B4526" },
    { name:"ブルーベリー", shell:"#A8C3E8", shellLight:"#C7DAF2", filling:"#6E96D6", fillingDark:"#4E76BD" },
    { name:"ピーチ",     shell:"#F5C9A0", shellLight:"#FADFC4", filling:"#E89A5A", fillingDark:"#D07A38" },
    { name:"ミント",     shell:"#A8E0CE", shellLight:"#C9EFE1", filling:"#5FBF9C", fillingDark:"#3F9A7A" }
  ];

  var fortunes = [
    { rank:"大大吉", weight:3, overall:[
        "これ以上ないくらいの大当たり!今日はどんな願いも叶いやすい特別な日です。",
        "一生分の運を使うくらいの絶好調。思い切って動くほど良いことが起こります。"
      ]},
    { rank:"大吉", weight:15, overall:[
        "甘い出来事が次々に舞い込む、幸運いっぱいの一日になりそうです。",
        "積み重ねてきたことが花開くタイミング。自信を持って進んで大丈夫。"
      ]},
    { rank:"中吉", weight:17, overall:[
        "穏やかながらも着実に、良い流れが続いていく予感があります。",
        "焦らずマイペースに過ごすことで、じわじわ幸運が近づいてきます。"
      ]},
    { rank:"小吉", weight:17, overall:[
        "小さな嬉しいことが日常のあちこちに隠れている一日です。",
        "気負わず自然体でいることが、ちょうど良い運を引き寄せます。"
      ]},
    { rank:"吉", weight:20, overall:[
        "いつも通りの一日の中に、ささやかな幸せが見つかりそうです。",
        "特別なことがなくても、穏やかであれば十分に吉と言えます。"
      ]},
    { rank:"末吉", weight:15, overall:[
        "今はまだ助走の時期。焦らず準備を整えれば、後から実を結びます。",
        "すぐに結果が出なくても大丈夫。丁寧に取り組めば道は開けます。"
      ]},
    { rank:"半吉", weight:10, overall:[
        "良いことも気を付けたいことも半分ずつ。バランスを意識して過ごして。",
        "波はあるけれど、悪くはない一日。無理せず自分のペースで。"
      ]},
    { rank:"平", weight:3, overall:[
        "特に大きな変化のない、穏やかで静かな一日になりそうです。",
        "可もなく不可もなく。いつも通り過ごせることに感謝したい日です。"
      ]}
  ];

  var categoryPools = {
    "大大吉": {
      love: ["運命的な出会いや進展がありそう。", "気持ちを伝えるなら今がベストタイミング。"],
      work: ["大きなチャンスが舞い込む予感。", "挑戦したことがそのまま成功につながります。"],
      health: ["絶好調!新しいことを始めるにも良い時。", "エネルギーに満ちて、何をしても楽しい日。"],
      money: ["思わぬ臨時収入があるかも。", "欲しかったものを手に入れるチャンス。"]
    },
    "大吉": {
      love: ["想いが通じ合いやすい、嬉しい進展の予感。", "素直な気持ちが良い結果を呼びます。"],
      work: ["努力がしっかり評価される時期です。", "新しい挑戦がそのまま成果につながります。"],
      health: ["心身ともに絶好調で過ごせそうです。", "軽く体を動かすとさらに調子アップ。"],
      money: ["嬉しい出費や収入のチャンスがありそう。", "欲しかったものに手を伸ばして良いタイミング。"]
    },
    "中吉": {
      love: ["穏やかで温かい時間が距離を縮めます。", "誠実な態度が相手に伝わりやすい時。"],
      work: ["コツコツの積み重ねが認められ始めます。", "周りとの連携がうまくいきそうです。"],
      health: ["規則正しい生活が良いリズムを作ります。", "軽い運動が心身を整えてくれそう。"],
      money: ["堅実な使い方が安心につながります。", "無駄遣いを控えれば着実に貯まりそう。"]
    },
    "小吉": {
      love: ["自然な流れに任せると良い関係が築けます。", "些細な思いやりが相手に伝わりやすい時。"],
      work: ["目の前のことを一つずつこなすと力になります。", "無理のない挑戦が吉と出そうです。"],
      health: ["軽やかな気分で過ごせる一日です。", "十分な睡眠が調子を整えてくれます。"],
      money: ["収支のバランスは概ね良好です。", "必要なものを優先すると吉。"]
    },
    "吉": {
      love: ["日々の会話から関係が少しずつ深まります。", "自然体でいることが魅力につながります。"],
      work: ["いつも通りの丁寧さが信頼を生みます。", "地道な作業がやがて成果になります。"],
      health: ["大きな崩れなく安定した状態が続きます。", "適度な休憩を意識すると◎。"],
      money: ["無理のないやりくりがうまくいきます。", "予定外の出費には少し注意を。"]
    },
    "末吉": {
      love: ["時間をかけて関係が育っていく予感。", "焦らず相手のペースに合わせてみて。"],
      work: ["今の努力は後になって評価されます。", "基礎固めに時間を使うと後々役立ちます。"],
      health: ["生活リズムを整えると今後の安定に。", "無理せず休むときはしっかり休んで。"],
      money: ["大きな動きより様子見が賢明です。", "将来のための準備期間と捉えて。"]
    },
    "半吉": {
      love: ["良い面と気になる面が半々。焦らず様子を見て。", "小さなすれ違いには早めのひと言を。"],
      work: ["順調な部分と課題が入り混じる時期。", "確認をこまめにすると安心です。"],
      health: ["無理をすると崩れやすいので注意を。", "こまめな休息を心がけて。"],
      money: ["衝動買いには少しブレーキを。", "収支の見直しにちょうど良い時期。"]
    },
    "平": {
      love: ["特別な動きは少なめ。今の関係を大切に。", "自分磨きの時間に充ててみて。"],
      work: ["いつも通りをきちんとこなせば十分。", "無理に動かず現状維持が吉。"],
      health: ["体調は安定。いつものペースで大丈夫。", "生活リズムを崩さないよう意識して。"],
      money: ["大きな支出も収入もなく平穏。", "普段通りのやりくりで問題なし。"]
    }
  };

  var proverbs = [
    "甘い時間は、自分へのご褒美から始まる",
    "一口ごとに、今日の運が近づいてくる",
    "迷ったときは、甘いものに聞いてみる",
    "小さな幸せは、いつも近くに転がっている",
    "噛みしめるほど、味わいは深くなる",
    "今日のひと粒が、明日の元気になる",
    "甘さも運も、分け合うともっと美味しい",
    "焦らず、ゆっくり味わうのが吉",
    "好きなものを選ぶ勇気が、運を引き寄せる",
    "どんな味にも、ちゃんと理由がある"
  ];

  var luckyColors = ["桜色", "ミントグリーン", "ラベンダー", "レモンイエロー", "キャラメルブラウン", "ベビーブルー", "ピーチ", "アイボリー"];

  function pick(arr){ return arr[Math.floor(Math.random() * arr.length)]; }

  function weightedRank(){
    var total = fortunes.reduce(function(s,f){ return s + f.weight; }, 0);
    var r = Math.random() * total;
    for (var i=0; i<fortunes.length; i++){
      r -= fortunes[i].weight;
      if (r <= 0) return fortunes[i];
    }
    return fortunes[fortunes.length-1];
  }

  function macaronSVG(t){
    var dots = "";
    for (var i=0; i<13; i++){
      var x = (13 + i*5.8).toFixed(1);
      dots += '<circle cx="'+x+'" cy="51" r="2.5" fill="'+t.fillingDark+'"/>';
    }
    return '<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">' +
      '<ellipse cx="50" cy="64" rx="40" ry="27" fill="'+t.shell+'"/>' +
      '<ellipse cx="50" cy="36" rx="40" ry="27" fill="'+t.shellLight+'"/>' +
      '<rect x="11" y="45" width="78" height="11" rx="5" fill="'+t.filling+'"/>' +
      dots +
      '</svg>';
  }

  var grid = document.getElementById('macaronGrid');
  var bubble = document.getElementById('bubble');
  var prompt = document.getElementById('prompt');
  var resultEl = document.getElementById('result');
  var slip = document.getElementById('slip');
  var againBtn = document.getElementById('againBtn');
  var gridWrap = document.getElementById('gridWrap');

  var order = [];

  function buildGrid(){
    grid.innerHTML = '';
    order = themes.slice().sort(function(){ return Math.random()-0.5; }).slice(0,8);
    order.forEach(function(theme, idx){
      var btn = document.createElement('button');
      btn.className = 'macaron-btn';
      btn.setAttribute('aria-label', theme.name + 'のマカロン');
      var inner = document.createElement('div');
      inner.className = 'macaron-inner';
      inner.innerHTML = macaronSVG(theme);
      btn.appendChild(inner);
      btn.addEventListener('click', function(){ selectMacaron(btn, inner, theme); });
      grid.appendChild(btn);
    });
    resultEl.classList.remove('show');
    prompt.textContent = '気になる一粒を選んでください';
    prompt.style.visibility = 'visible';
    gridWrap.style.display = '';
    window.scrollTo({ top:0, behavior:'smooth' });
  }

  function spawnCrumbs(rect, color){
    for (var i=0; i<10; i++){
      var c = document.createElement('div');
      c.className = 'crumb';
      c.style.background = color;
      c.style.left = (rect.left + rect.width/2) + 'px';
      c.style.top = (rect.top + rect.height/2) + 'px';
      var dx = (Math.random()-0.5) * 120;
      var dy = (Math.random()) * 90 + 20;
      var rot = (Math.random()*360-180) + 'deg';
      c.style.setProperty('--dx', dx + 'px');
      c.style.setProperty('--dy', dy + 'px');
      c.style.setProperty('--rot', rot);
      document.body.appendChild(c);
      (function(el){ setTimeout(function(){ el.remove(); }, 750); })(c);
    }
  }

  function selectMacaron(btn, inner, theme){
    var allBtns = grid.querySelectorAll('.macaron-btn');
    allBtns.forEach(function(b){
      if (b !== btn) b.classList.add('dim');
      else b.classList.add('picked');
    });

    prompt.textContent = '';
    bubble.classList.add('show');

    var steps = [
      { scale: 0.78, rot: -10 },
      { scale: 0.48, rot: 8 },
      { scale: 0.0,  rot: -14 }
    ];
    var delay = 0;
    steps.forEach(function(s, i){
      setTimeout(function(){
        inner.style.transform = 'scale(' + s.scale + ') rotate(' + s.rot + 'deg)';
        if (s.scale === 0) inner.style.opacity = '0';
        var rect = btn.getBoundingClientRect();
        spawnCrumbs(rect, i % 2 === 0 ? theme.filling : theme.shell);
      }, delay);
      delay += 380;
    });

    setTimeout(function(){
      bubble.classList.remove('show');
      gridWrap.style.transition = 'opacity 0.4s ease';
      gridWrap.style.opacity = '0';
      setTimeout(function(){
        gridWrap.style.display = 'none';
        gridWrap.style.opacity = '1';
        gridWrap.style.transition = '';
        showResult();
      }, 400);
    }, delay + 250);
  }

  var furiganaMap = { "大吉": "ﾃﾞｪｷﾁ", "大大吉": "ﾃﾞｪﾃﾞｪｷﾁ" };

  function rankHTML(rank){
    if (furiganaMap[rank]) {
      return '<ruby>' + rank + '<rt>' + furiganaMap[rank] + '</rt></ruby>';
    }
    return rank;
  }

  function renderSlip(f){
    var cats = categoryPools[f.rank];
    slip.innerHTML =
      '<div class="rank">' + rankHTML(f.rank) + '</div>' +
      '<div class="overall">' + pick(f.overall) + '</div>' +
      '<div class="divider"></div>' +
      '<div class="categories">' +
        '<div class="cat"><div class="label">恋愛運</div><div class="text">' + pick(cats.love) + '</div></div>' +
        '<div class="cat"><div class="label">仕事運</div><div class="text">' + pick(cats.work) + '</div></div>' +
        '<div class="cat"><div class="label">健康運</div><div class="text">' + pick(cats.health) + '</div></div>' +
        '<div class="cat"><div class="label">金運</div><div class="text">' + pick(cats.money) + '</div></div>' +
      '</div>' +
      '<div class="proverb">' + pick(proverbs) + '</div>' +
      '<div class="lucky-row">' +
        '<div class="lucky"><div class="label">LUCKY FLAVOR</div><div class="value">' + pick(themes).name + '</div></div>' +
        '<div class="lucky"><div class="label">LUCKY COLOR</div><div class="value">' + pick(luckyColors) + '</div></div>' +
        '<div class="lucky"><div class="label">LUCKY NUMBER</div><div class="value">' + (Math.floor(Math.random()*9)+1) + '</div></div>' +
      '</div>';
  }

  function showResult(){
    var f = weightedRank();
    renderSlip(f);
    resultEl.classList.add('show');
  }

  againBtn.addEventListener('click', buildGrid);

  buildGrid();

})();
</script>

</body>
</html>
